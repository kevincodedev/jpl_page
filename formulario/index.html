<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Formulario Oficial de Registro de Personal y Contactos de JPL y Asociados.">
  <title>Registro de Datos | JPL y Asociados</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="app-container">
    <!-- Header Corporativo con Logo -->
    <header class="brand-header">
      <div class="logo-wrapper">
        <img src="LogoJPL.webp" alt="JPL y Asociados" class="brand-logo-img">
      </div>
      <div class="logo-text">
        <h1>Estrategias que Elevan, Liderazgo que Impacta</h1>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="form-card">

        <!-- Card Header -->
        <div class="card-header">
          <h2>Formulario de Registro</h2>
          <p>Por favor complete sus datos corporativos para registrarse en nuestro sistema.</p>
        </div>

        <!-- Formulario -->
        <form id="registroForm" novalidate>

          <!-- Campo 1: Nombre y Apellido -->
          <div class="form-group">
            <label for="nombre" class="form-label">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              Nombre y Apellido <span class="required">*</span>
            </label>
            <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ej. Carlos Mendoza" required
              autocomplete="name">
            <span class="error-message" id="nombreError"></span>
          </div>

          <!-- Campo 2: Teléfono -->
          <div class="form-group">
            <label for="telefono" class="form-label">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                </path>
              </svg>
              Teléfono de Contacto <span class="required">*</span>
            </label>
            <input type="tel" id="telefono" name="telefono" class="form-control" placeholder="Ej. +58 414 1234567"
              required autocomplete="tel">
            <span class="error-message" id="telefonoError"></span>
          </div>

          <!-- Campo 3: Correo Electrónico -->
          <div class="form-group">
            <label for="email" class="form-label">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
              Correo Electrónico <span class="required">*</span>
            </label>
            <input type="email" id="email" name="email" class="form-control" placeholder="ejemplo@jpl.com" required
              autocomplete="email">
            <span class="error-message" id="emailError"></span>
          </div>

          <!-- Campo 4: Cargo -->
          <div class="form-group">
            <label for="cargo" class="form-label">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
              </svg>
              Cargo / Puesto de Trabajo <span class="required">*</span>
            </label>
            <input type="text" id="cargo" name="cargo" class="form-control" placeholder="Ej. Gerente de Proyecto"
              required autocomplete="organization-title">
            <span class="error-message" id="cargoError"></span>
          </div>

          <!-- Alert Result Area -->
          <div id="statusAlert" class="status-alert" style="display: none;" role="alert">
            <div id="statusIcon" class="alert-icon"></div>
            <div id="statusMessage" class="alert-text"></div>
          </div>

          <!-- Botones de Acción -->
          <div class="form-actions">
            <button type="submit" id="submitBtn" class="btn btn-primary">
              <span class="btn-text">Registrar Datos</span>
              <span class="spinner" style="display: none;"></span>
            </button>
            <button type="reset" id="resetBtn" class="btn btn-outline">Limpiar</button>
          </div>

        </form>
      </div>
    </main>

    <!-- Footer -->
    <footer class="brand-footer">
      <p>&copy; <span id="currentYear"></span> <strong>JPL y Asociados</strong>. Todos los derechos reservados.</p>
      <p class="sub-footer">Sistema de Gestión de Registros Corporativos</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>

</html>
